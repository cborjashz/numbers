<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Lotería - PDV</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #2d2d44; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 20px; }
        .login-box, .game-box { display: none; }
        .login-box.active, .game-box.active { display: block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #3b3b5c; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 8px; background: #00a86b; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background: #008f5a; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 20px 0; }
        /* Estilos para que el botón tenga el número grande y el monto pequeño debajo */
        .num-btn {
            padding: 8px 0 4px 0;  /* Ajustamos padding para que quepa el monto */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 55px;  /* Altura fija para que todos sean uniformes */
            line-height: 1.2;
            background: #3b3b5c;   /* Fondo oscuro normal */
            color: #ffffff;        /* Texto del número SIEMPRE blanco */            
        }
        /* Cuando el número está SELECCIONADO: solo cambia el fondo */
        .num-btn.selected {
            background: #00a86b;   /* Fondo verde elegante */
            color: #ffffff;        /* El texto del número SIGUE siendo blanco */
            box-shadow: 0 0 8px rgba(0, 168, 107, 0.5); /* Un brillo suave */
        }
        .num-btn.selected div {
            color: black !important;  /* El monto también se vuelve negro al seleccionar */
        }
        .num-btn:hover {
            background: #4a4a6e;
        }
        .num-btn.selected:hover {
            background: #009a5f;   /* Un verde un poco más oscuro al pasar el mouse */
        }        
        
        /* El monto (texto dorado) siempre mantiene su color */
        .num-btn div:last-child {
            font-size: 9px;
            color: #f0e68c;        /* Dorado claro */
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        /* Cuando está seleccionado, el monto también mantiene su color dorado */
        .num-btn.selected div:last-child {
            color: #f0e68c;        /* Se mantiene dorado */
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
        
        .opciones-rapidas { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .opcion-btn { flex: 1; min-width: 60px; padding: 10px; background: #ffaa00; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .opcion-btn:hover { background: #e69900; }
        .form-row { display: flex; gap: 10px; }
        .form-row input { flex: 1; }
        .message { margin-top: 15px; text-align: center; font-weight: bold; }
        .success { color: #00a86b; }
        .error { color: #ff5555; }
        .logout { background: #555; margin-top: 10px; }
        .logout:hover { background: #777; }
        #opcionesContainer {
            min-height: 40px;
            border: 1px dashed #ffaa00;
            padding: 5px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 LOTERÍA</h1>

        <!-- LOGIN -->
        <div id="loginBox" class="login-box active">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="loginUser" placeholder="Usuario">
            <input type="password" id="loginPass" placeholder="Contraseña">
            <button onclick="login()">Acceder</button>
            <div id="loginMsg" class="message error"></div>
        </div>

        <!-- JUEGO -->
        <div id="gameBox" class="game-box">
            <div style="display:flex; justify-content:space-between;">
                <span id="userDisplay" style="font-weight:bold;"></span>
                <button class="logout" onclick="logout()" style="width:auto; padding:5px 15px;">Salir</button>
                <!-- Botón para abrir reporte -->
                <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                    <button onclick="abrirReporte()" style="width: auto; padding: 8px 15px; background: #f39c12; color: black; font-size: 14px; border-radius: 8px;">📊 Reporte por Cliente</button>
                </div>
            </div>

            <!-- Cargar recibo de referencia -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
                <input type="number" id="reciboReferencia" placeholder="Recibo de referencia" style="flex: 1;">
                <button onclick="cargarRecibo()" style="width: auto; padding: 10px 20px; background: #ffaa00; color: black;">📂 Cargar Recibo</button>
                <button onclick="reimprimirRecibo()" style="width: auto; padding: 10px 15px; background: #2196f3; color: white;" title="Reimprimir recibo">🖨️</button>
            </div>

            <!-- Opciones rápidas (combobox) -->
            <div style="display: flex; gap: 10px; margin: 15px 0; align-items: center;">
                <label for="opcionesSelect" style="font-size: 14px; font-weight: bold;">Opción rápida:</label>
                <select id="opcionesSelect" style="flex: 1; padding: 10px; background: #3b3b5c; color: white; border: none; border-radius: 8px; font-size: 14px;">
                    <option value="">-- Seleccione una opción --</option>
                </select>
            </div>

            <!-- Botón para limpiar selección -->
            <div style="display: flex; justify-content: center; margin: 5px 0 15px 0;">
                <button onclick="limpiarSeleccion()" style="width: auto; padding: 8px 25px; background: #d32f2f; color: white; font-size: 14px; border-radius: 8px;">🗑️ Limpiar Selección</button>
            </div>

            <!-- Tablero de números -->
            <div class="grid" id="numberGrid"></div>

            <!-- Formulario de venta -->
            <div class="form-row">
                <input type="text" id="clienteInput" placeholder="Cliente">
                <input type="number" id="precioInput" placeholder="Precio L." step="0.01">
            </div>

            <!-- Selectores de fecha y cierre (misma fila) -->
            <div style="display: flex; gap: 10px; margin: 10px 0; align-items: center; flex-wrap: wrap;">
                <label for="fechaSelect" style="font-size: 14px; font-weight: bold;">📅 Fecha:</label>
                <input type="date" id="fechaSelect" style="flex: 1; padding: 8px; background: #3b3b5c; color: white; border: none; border-radius: 5px; min-width: 120px;">
                
                <label for="cierreSelect" style="font-size: 14px; font-weight: bold;">🕒 Cierre:</label>
                <select id="cierreSelect" style="flex: 1; padding: 8px; background: #3b3b5c; color: white; border: none; border-radius: 5px; min-width: 120px;">
                    <option value="">Automático (según hora)</option>
                    <option value="Cierre 1 (11am)">Cierre 1 (11am)</option>
                    <option value="Cierre 2 (3pm)">Cierre 2 (3pm)</option>
                    <option value="Cierre 3 (9pm)">Cierre 3 (9pm)</option>
                </select>
            </div>

            <!-- MODAL DE PRECIO POR NÚMERO -->
            <div id="precioModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
                <div style="background: #2d2d44; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; color: white;">
                    <h3 style="margin-top: 0;">💲 Asignar Precio</h3>
                    <p style="font-size: 16px;">Número seleccionado: <strong id="modalNumero" style="color: #ffd700;"></strong></p>
                    <div style="margin: 15px 0;">
                        <label style="font-size: 14px;">Precio (L.):</label>
                        <input type="number" id="modalPrecio" step="0.01" min="0.01" style="width: 100%; padding: 10px; background: #3b3b5c; color: white; border: none; border-radius: 5px; font-size: 16px;">
                    </div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button onclick="cerrarModalPrecio()" style="background: #555; color: white; border: none; border-radius: 5px; padding: 10px 20px; cursor: pointer;">Cancelar</button>
                        <button onclick="agregarNumeroConPrecio()" style="background: #00a86b; color: white; border: none; border-radius: 5px; padding: 10px 20px; cursor: pointer;">✅ Agregar</button>
                    </div>
                </div>
            </div>
            
             <!-- Tabla resumen de números seleccionados con precio -->
            <div id="resumenContainer" style="margin: 15px 0; border: 1px solid #3b3b5c; border-radius: 8px; padding: 10px; display: none;">
                <h4 style="margin: 0 0 10px 0;">📋 Resumen de selección</h4>
                <table id="resumenTable" style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    <thead style="background: #3b3b5c;">
                        <tr>
                            <th style="padding: 6px; text-align: left;">Número</th>
                            <th style="padding: 6px; text-align: left;">Precio (L.)</th>
                            <th style="padding: 6px; text-align: center;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="resumenTableBody">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
                <div style="text-align: right; margin-top: 10px; font-weight: bold;">
                    Total: <span id="resumenTotal">L. 0.00</span>
                </div>
            </div>

            <button onclick="vender()">🟢 VENDER</button>
            <div id="resultMsg" class="message"></div>
        </div>
    </div>

    <script>
        // Variables de estado
        let currentUser = null;
        let currentToken = null;
        let selectedNumbers = [];

        // URL de la API
        const API = '/api';

        // Login
        async function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const res = await fetch(API + '/login', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({usuario: user, password: pass})
            });
            const data = await res.json();
            if (res.ok) {
                // Guardar datos en el navegador
                currentUser = data.usuario;
                currentToken = data.token;
                localStorage.setItem('loteria_token', data.token);
                localStorage.setItem('loteria_usuario', data.usuario);

                document.getElementById('userDisplay').innerText = '👤 ' + currentUser;
                document.getElementById('loginBox').classList.remove('active');
                document.getElementById('gameBox').classList.add('active');
                cargarOpciones();
                generarTablero();
                // Establecer fecha actual por defecto en el selector
                const hoy = new Date();
                const fechaLocal = hoy.toISOString().split('T')[0];
                document.getElementById('fechaSelect').value = fechaLocal;  

            } else {
                document.getElementById('loginMsg').innerText = '❌ ' + data.detail;
            }
        }

        async function logout() {
            const token = localStorage.getItem('loteria_token');
            if (token) {
                try {
                    // Enviar petición al backend para cerrar la sesión
                    await fetch(API + '/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        }
                    });
                } catch (error) {
                    // Si falla la red, igual limpiamos localmente
                    console.error('Error al cerrar sesión en el servidor:', error);
                }
            }

            // Limpiar localStorage y variables
            localStorage.removeItem('loteria_token');
            localStorage.removeItem('loteria_usuario');
            currentUser = null;
            currentToken = null;
            selectedNumbers = [];
            
            document.getElementById('gameBox').classList.remove('active');
            document.getElementById('loginBox').classList.add('active');
            document.getElementById('loginMsg').innerText = '';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

        // Generar los 100 botones (00 al 99)
        function generarTablero() {
            const grid = document.getElementById('numberGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const num = i.toString().padStart(2, '0');
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.id = `btn-${num}`;  // Agregamos un ID para identificarlo fácilmente
                
                // Estructura interna: número grande + espacio para el monto
                btn.innerHTML = `
                    <div style="font-size: 16px; font-weight: bold;">${num}</div>
                    <div id="monto-${num}" style="font-size: 10px; color: #ffd700; margin-top: 2px; font-weight: normal;"></div>
                `;
                
                btn.dataset.num = num;
                btn.onclick = () => toggleNumber(num, btn);
                grid.appendChild(btn);
            }
            // Después de generar el tablero, cargamos los montos
            actualizarMontosTablero();
        }

      

        async function actualizarMontosTablero() {
            const token = localStorage.getItem('loteria_token');
            if (!token) return; // Si no hay token, no hacemos nada

            // Leer valores de los selectores
            const fecha = document.getElementById('fechaSelect').value;
            const cierre = document.getElementById('cierreSelect').value;

            // Construir la URL con los parámetros
            let url = API + '/tablero-estado';
            const params = [];
            if (fecha) params.push(`fecha=${fecha}`);
            if (cierre) params.push(`cierre=${encodeURIComponent(cierre)}`);
            if (params.length > 0) url += '?' + params.join('&');

            try {
                const res = await fetch(url, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        logout();
                        return;
                    }
                    return;
                }

                const datos = await res.json();

                // Recorrer todos los botones (00 al 99) y actualizar el monto
                for (let i = 0; i < 100; i++) {
                    const num = i.toString().padStart(2, '0');
                    const montoDiv = document.getElementById(`monto-${num}`);
                    if (montoDiv) {
                        const monto = datos[num];
                        if (monto && monto > 0) {
                            montoDiv.innerText = `L. ${monto.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                            montoDiv.style.color = '#ffd700';
                        } else {
                            montoDiv.innerText = '';
                            montoDiv.style.color = '#ffd700';
                        }
                    }
                }
            } catch (error) {
                console.error('Error al actualizar montos del tablero:', error);
            }
        }

        async function cargarRecibo(numReciboParam = null) {
            // Si recibimos el número como parámetro, lo usamos; si no, leemos del input
            const numRecibo = numReciboParam || document.getElementById('reciboReferencia').value;
            if (!numRecibo) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Ingrese un número de recibo</span>';
                return;
            }
    
            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                logout();
                return;
            }

            try {
                const res = await fetch(API + '/recibo/' + numRecibo, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                        logout();
                        return;
                    }
                    const data = await res.json();
                    document.getElementById('resultMsg').innerHTML = `<span class="error">❌ ${data.detail}</span>`;
                    return;
                }
        
                const data = await res.json();
        
                // Limpiar selección previa y tabla resumen
                limpiarSeleccion();

                // Agregar los números con sus precios a la tabla resumen y al tablero
                data.items.forEach(item => {
                    const num = item.numero;
                    const precio = item.precio;
                    const btn = document.querySelector(`.num-btn[data-num="${num}"]`);
                    if (btn && !btn.classList.contains('selected')) {
                        btn.classList.add('selected');
                        selectedNumbers.push(num);
                        // Agregar a la tabla resumen con su precio
                        agregarAResumen(num, precio);
                    }
                });
        
                document.getElementById('resultMsg').innerHTML = `<span class="success">✅ Recibo ${numRecibo} cargado! ${data.items.length} números con sus precios.</span>`;
        
            } catch (error) {
                document.getElementById('resultMsg').innerHTML = `<span class="error">❌ Error de conexión</span>`;
            }
        }

        async function reimprimirRecibo(numReciboParam = null) {
            // Si recibimos el número como parámetro, lo usamos; si no, leemos del input
            const numRecibo = numReciboParam || document.getElementById('reciboReferencia').value;
            if (!numRecibo) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Ingrese un número de recibo para reimprimir</span>';
                return;
            }

            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                logout();
                return;
            }

            try {
                const res = await fetch(API + '/reimprimir/' + numRecibo, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                        logout();
                        return;
                    }
                    const data = await res.json();
                    document.getElementById('resultMsg').innerHTML = `<span class="error">❌ ${data.detail}</span>`;
                    return;
                }

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `recibo_${numRecibo}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                document.getElementById('resultMsg').innerHTML = `<span class="success">✅ Recibo ${numRecibo} reimpreso exitosamente!</span>`;

            } catch (error) {
                document.getElementById('resultMsg').innerHTML = `<span class="error">❌ Error de conexión al reimprimir</span>`;
            }
        }

        function toggleNumber(num, btn) {
            // Si el número ya está seleccionado, lo desmarcamos
            if (btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                const idx = selectedNumbers.indexOf(num);
                if (idx > -1) {
                    selectedNumbers.splice(idx, 1);
                }
                // También lo eliminamos de la tabla resumen si estaba ahí
                eliminarDeResumen(num);
                return;
            }

            // Si no está seleccionado, abrimos el modal para pedir el precio
            abrirModalPrecio(num, btn);
        }

        let pendingNumber = null;
        let pendingButton = null;

        function abrirModalPrecio(num, btn) {
            pendingNumber = num;
            pendingButton = btn;
            document.getElementById('modalNumero').innerText = num;
            document.getElementById('modalPrecio').value = '';
            document.getElementById('modalPrecio').focus();
            document.getElementById('precioModal').style.display = 'flex';
        }

        function cerrarModalPrecio() {
            document.getElementById('precioModal').style.display = 'none';
            pendingNumber = null;
            pendingButton = null;
        }

        function agregarNumeroConPrecio() {
            const precio = parseFloat(document.getElementById('modalPrecio').value);
            if (!precio || precio <= 0) {
                alert('❌ Ingrese un precio válido mayor a 0');
                return;
            }

            // Caso 1: Es una opción rápida (hay números pendientes en pendingQuickNumbers)
            if (pendingQuickNumbers && pendingQuickNumbers.length > 0) {
                pendingQuickNumbers.forEach(num => {
                    // Buscar el botón del número en el tablero
                    const btn = document.querySelector(`.num-btn[data-num="${num}"]`);
                    if (btn && !btn.classList.contains('selected')) {
                        btn.classList.add('selected');
                        selectedNumbers.push(num);
                        // Agregar a la tabla resumen
                        agregarAResumen(num, precio);
                    }
                });
                // Limpiar la variable temporal
                pendingQuickNumbers = [];
                cerrarModalPrecio();
                actualizarMontosTablero();
                return;
            }

            // Caso 2: Es un número individual (pendingNumber y pendingButton están definidos)
            if (pendingNumber && pendingButton) {
                pendingButton.classList.add('selected');
                selectedNumbers.push(pendingNumber);
                agregarAResumen(pendingNumber, precio);
                cerrarModalPrecio();
                actualizarMontosTablero();
                return;
            }

            // Si no hay ni pendingNumber ni pendingQuickNumbers, no hacer nada
            alert('❌ No hay números seleccionados para asignar precio.');
        }

        function agregarAResumen(num, precio) {
            const tbody = document.getElementById('resumenTableBody');
            const row = document.createElement('tr');
            row.id = `resumen-${num}`;
            row.innerHTML = `
                <td style="padding: 6px;">${num}</td>
                <td style="padding: 6px;">L. ${precio.toFixed(2)}</td>
                <td style="padding: 6px; text-align: center;">
                    <button onclick="eliminarDeResumen('${num}')" style="background: #d32f2f; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer;">🗑️</button>
                </td>
            `;
            tbody.appendChild(row);

            // Mostrar el contenedor si estaba oculto
            document.getElementById('resumenContainer').style.display = 'block';
            actualizarTotalResumen();
        }

        function eliminarDeResumen(num) {
            const row = document.getElementById(`resumen-${num}`);
            if (row) {
                row.remove();
                // Desmarcar del tablero
                const btn = document.querySelector(`.num-btn[data-num="${num}"]`);
                if (btn) {
                    btn.classList.remove('selected');
                }
                const idx = selectedNumbers.indexOf(num);
                if (idx > -1) {
                    selectedNumbers.splice(idx, 1);
                }
                actualizarTotalResumen();
                // Ocultar el contenedor si ya no hay filas
                if (document.getElementById('resumenTableBody').children.length === 0) {
                    document.getElementById('resumenContainer').style.display = 'none';
                }
            }
        }

        function actualizarTotalResumen() {
            const rows = document.getElementById('resumenTableBody').children;
            let total = 0;
            for (let row of rows) {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 2) {
                    const precioText = cells[1].innerText.replace('L. ', '');
                    total += parseFloat(precioText);
                }
            }
            document.getElementById('resumenTotal').innerText = `L. ${total.toFixed(2)}`;
        }

        async function cargarOpciones() {
            const select = document.getElementById('opcionesSelect');
            // Limpiar opciones previas (pero mantener la primera)
            while (select.options.length > 1) {
                select.remove(1);
            }

            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                logout();
                return;
            }

            const res = await fetch(API + '/opciones', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            
            if (!res.ok) {
                if (res.status === 401) {
                    document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                    logout();
                    return;
                }
                return;
            }

            const opciones = await res.json();
            
            if (opciones.length === 0) {
                // Si no hay opciones, agregamos una opción informativa
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'No hay opciones rápidas configuradas';
                opt.disabled = true;
                select.appendChild(opt);
                return;
            }
            
            opciones.forEach(op => {
                const opt = document.createElement('option');
                opt.value = op.numeros_incluidos;
                opt.textContent = op.nombre_opcion;
                select.appendChild(opt);
            });

            // Agregar evento para cuando el usuario seleccione una opción
            select.onchange = function() {
                seleccionarOpcion(this.value);
                // Opcional: resetear el combobox después de seleccionar (para poder elegir otra)
                // this.value = '';
            };

            // Agregar eventos para actualizar automáticamente al cambiar fecha o cierre
            document.getElementById('fechaSelect').onchange = function() {
                actualizarMontosTablero();
            };
            document.getElementById('cierreSelect').onchange = function() {
                actualizarMontosTablero();
            };            

        }

        function limpiarSeleccion() {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            selectedNumbers = [];
            document.getElementById('resultMsg').innerHTML = '';
            // Limpiar tabla resumen
            document.getElementById('resumenTableBody').innerHTML = '';
            document.getElementById('resumenContainer').style.display = 'none';
            document.getElementById('resumenTotal').innerText = 'L. 0.00';
        }

        // Variable temporal para guardar los números de la opción rápida
        let pendingQuickNumbers = [];

        function seleccionarOpcion(numerosStr) {
            if (!numerosStr) return; // Si no hay valor, no hacer nada

            // Dividir la cadena y guardar los números en la variable temporal
            pendingQuickNumbers = numerosStr.split(',');

            // Abrir el modal de precio con un mensaje especial
            document.getElementById('modalNumero').innerText = `Opción rápida (${pendingQuickNumbers.length} números)`;
            document.getElementById('modalPrecio').value = '';
            document.getElementById('modalPrecio').focus();
            document.getElementById('precioModal').style.display = 'flex';
        }

        async function vender() {
            const cliente = document.getElementById('clienteInput').value;
            const cierreElegido = document.getElementById('cierreSelect').value;

            // Obtener los items de la tabla resumen
            const rows = document.getElementById('resumenTableBody').children;
            if (rows.length === 0) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ No hay números seleccionados con precio. Seleccione números y asigne precio.</span>';
                return;
            }

            const items = [];
            for (let row of rows) {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 2) {
                    const numero = cells[0].innerText.trim();
                    const precioText = cells[1].innerText.replace('L. ', '');
                    const precio = parseFloat(precioText);
                    items.push({ numero, precio });
                }
            }

            if (!cliente) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Complete el nombre del Cliente</span>';
                return;
            }

            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                logout();
                return;
            }
            
            const res = await fetch(API + '/vender', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    nombre_vendedor: currentUser,
                    cliente: cliente,
                    items: items,
                    cierre_elegido: cierreElegido || null 
                })
            });
            
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `recibo_${Date.now()}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                document.getElementById('resultMsg').innerHTML = '<span class="success">✅ Venta exitosa! El recibo se ha descargado.</span>';
                
                // Limpiar todo
                limpiarSeleccion();
                document.getElementById('clienteInput').value = '';
                document.getElementById('cierreSelect').value = '';
                actualizarMontosTablero();
            } else {
                if (res.status === 401) {
                    document.getElementById('resultMsg').innerHTML = '<span class="error">❌ Sesión expirada. Por favor, vuelva a iniciar sesión.</span>';
                    logout();
                    return;
                }
                const data = await res.json();
                document.getElementById('resultMsg').innerHTML = `<span class="error">❌ ${data.detail}</span>`;
            }
        }

        function abrirReporte() {
            document.getElementById('reporteModal').style.display = 'flex';
            // Establecer fechas por defecto (hoy)
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('reporteFechaInicio').value = hoy;
            document.getElementById('reporteFechaFin').value = hoy;
            cargarReporte();
        }

        function cerrarReporte() {
            document.getElementById('reporteModal').style.display = 'none';
        }

        async function cargarReporte() {
            const fechaInicio = document.getElementById('reporteFechaInicio').value;
            const fechaFin = document.getElementById('reporteFechaFin').value;

            if (!fechaInicio || !fechaFin) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Seleccione ambas fechas</td></tr>';
                return;
            }

            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Sesión expirada</td></tr>';
                return;
            }

            try {
                const res = await fetch(`${API}/reporte-ventas-cliente?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Sesión expirada</td></tr>';
                        return;
                    }
                    const data = await res.json();
                    document.getElementById('reporteTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ ${data.detail}</td></tr>`;
                    return;
                }

                const datos = await res.json();

                if (datos.length === 0) {
                    document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #aaa;">No hay ventas en el rango seleccionado</td></tr>';
                    return;
                }

                let html = '';
                let totalGeneral = 0;
                datos.forEach(item => {
                    totalGeneral += item.total_monto;
                    html += `
                        <tr style="border-bottom: 1px solid #3b3b5c;">
                            <td style="padding: 8px;">${item.cliente}</td>
                            <td style="padding: 8px;">${item.cierre}</td>
                            <td style="padding: 8px; text-align: center;">${item.total_numeros}</td>
                            <td style="padding: 8px; text-align: right;">L. ${item.total_monto.toFixed(2)}</td>
                            <td style="padding: 8px; text-align: center; white-space: nowrap;">
                                <button onclick="cargarRecibo(${item.num_recibo})" style="background: #ffaa00; color: black; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; margin-right: 4px; font-size: 4px;">📂</button>
                                <button onclick="reimprimirRecibo(${item.num_recibo})" style="background: #2196f3; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 4px;">🖨️</button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                    <tr style="background: #00a86b; font-weight: bold;">
                        <td colspan="4" style="padding: 8px; text-align: right;">TOTAL GENERAL</td>
                        <td style="padding: 8px; text-align: right;">L. ${totalGeneral.toFixed(2)}</td>
                    </tr>
                `;

                document.getElementById('reporteTableBody').innerHTML = html;

            } catch (error) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Error de conexión</td></tr>';
            }
        }
        
        async function descargarReportePDF() {
            const fechaInicio = document.getElementById('reporteFechaInicio').value;
            const fechaFin = document.getElementById('reporteFechaFin').value;

            if (!fechaInicio || !fechaFin) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Seleccione ambas fechas</td></tr>';
                return;
            }

            const token = localStorage.getItem('loteria_token');
            if (!token) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Sesión expirada</td></tr>';
                return;
            }

            try {
                const res = await fetch(`${API}/reporte-ventas-cliente-pdf?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Sesión expirada</td></tr>';
                        return;
                    }
                    const data = await res.json();
                    document.getElementById('reporteTableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ ${data.detail}</td></tr>`;
                    return;
                }

                // Descargar el PDF
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `reporte_ventas_${fechaInicio}_a_${fechaFin}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

            } catch (error) {
                document.getElementById('reporteTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #ff5555;">❌ Error de conexión</td></tr>';
            }
        }                

        // Verificar si ya hay una sesión guardada al cargar la página
        window.onload = function() {
            const savedToken = localStorage.getItem('loteria_token');
            const savedUser = localStorage.getItem('loteria_usuario');
            if (savedToken && savedUser) {
                currentToken = savedToken;
                currentUser = savedUser;
                document.getElementById('userDisplay').innerText = '👤 ' + currentUser;
                document.getElementById('loginBox').classList.remove('active');
                document.getElementById('gameBox').classList.add('active');
                cargarOpciones();
                generarTablero();
            }
        };

    </script>
    <!-- MODAL DE REPORTE -->
    <div id="reporteModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #2d2d44; padding: 20px; border-radius: 15px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; color: white;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h2 style="margin: 0;">📊 Reporte de Ventas por Cliente</h2>
                <button onclick="cerrarReporte()" style="background: #d32f2f; color: white; border: none; border-radius: 5px; padding: 5px 15px; cursor: pointer;">✕ Cerrar</button>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="date" id="reporteFechaInicio" style="flex: 1; padding: 8px; background: #3b3b5c; color: white; border: none; border-radius: 5px;">
                <input type="date" id="reporteFechaFin" style="flex: 1; padding: 8px; background: #3b3b5c; color: white; border: none; border-radius: 5px;">
                <button onclick="cargarReporte()" style="width: auto; padding: 8px 15px; background: #00a86b; color: white; border: none; border-radius: 5px;">🔍 Cargar</button>
                <button onclick="descargarReportePDF()" style="width: auto; padding: 8px 15px; background: #e74c3c; color: white; border: none; border-radius: 5px;">📄 Descargar PDF</button>
            </div>
            <div id="reporteResultado" style="max-height: 400px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    <thead style="background: #3b3b5c; position: sticky; top: 0;">
                        <tr>
                            <th style="padding: 8px; text-align: left;">Cliente</th>
                            <th style="padding: 8px; text-align: left;">Cierre</th>
                            <th style="padding: 8px; text-align: center;">Números</th>
                            <th style="padding: 8px; text-align: right;">Total L.</th>
                            <th style="padding: 8px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="reporteTableBody">
                        <tr><td colspan="4" style="text-align: center; padding: 20px; color: #aaa;">Seleccione fechas y presione "Cargar"</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
